<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube → Anki (Japanese)</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    input[type=text] { width: 70%; padding: .4rem; }
    button { padding: .4rem .8rem; }
    #preview img { width: 320px; display: block; margin: .5rem 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    td, th { border-bottom: 1px solid #ddd; padding: .3rem .5rem; text-align: left; vertical-align: top; }
    td.word { font-size: 1.3rem; white-space: nowrap; }
    td.sentence { color: #777; font-size: .85rem; }
    .error { color: #c00; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>YouTube → Anki (Japanese)</h1>

  <form id="url-form">
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <button type="submit">Load</button>
  </form>
  <p id="status"></p>

  <div id="preview" class="hidden">
    <img id="thumb" alt="">
    <strong id="title"></strong> <span id="author"></span>
    <p><button id="extract-btn">Extract vocabulary</button></p>
  </div>

  <div id="results" class="hidden">
    <p>
      <span id="count"></span>
      <button id="toggle-all">Select / deselect all</button>
      <button data-format="apkg" class="export">Download Anki deck (.apkg)</button>
      <button data-format="tsv" class="export">Download TSV</button>
    </p>
    <table>
      <thead><tr><th></th><th>Word</th><th>Reading</th><th>Meaning</th><th>Count</th><th>Example</th></tr></thead>
      <tbody id="cards"></tbody>
    </table>
  </div>

<script>
const $ = id => document.getElementById(id);
let video = null, cards = [];

function setStatus(msg, isError = false) {
  $('status').textContent = msg;
  $('status').className = isError ? 'error' : '';
}

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res;
}

$('url-form').onsubmit = async e => {
  e.preventDefault();
  $('preview').classList.add('hidden');
  $('results').classList.add('hidden');
  setStatus('Loading video…');
  try {
    video = await (await post('/api/preview', { url: $('url').value })).json();
    $('thumb').src = video.thumbnail;
    $('title').textContent = video.title;
    $('author').textContent = `— ${video.author}`;
    $('preview').classList.remove('hidden');
    setStatus('');
  } catch (err) { setStatus(err.message, true); }
};

$('extract-btn').onclick = async () => {
  setStatus('Downloading subtitles and extracting vocabulary…');
  $('extract-btn').disabled = true;
  try {
    cards = (await (await post('/api/extract', { url: video.id })).json()).cards;
    renderCards();
    setStatus('');
  } catch (err) { setStatus(err.message, true); }
  $('extract-btn').disabled = false;
};

function renderCards() {
  const tbody = $('cards');
  tbody.innerHTML = '';
  cards.forEach((c, i) => {
    const tr = document.createElement('tr');
    for (const [cls, text] of [['', ''], ['word', c.word], ['', c.reading], ['', c.meaning], ['', c.count], ['sentence', c.sentence]]) {
      const td = document.createElement('td');
      td.className = cls;
      td.textContent = text;
      tr.appendChild(td);
    }
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.dataset.index = i;
    cb.onchange = updateCount;
    tr.firstChild.appendChild(cb);
    tbody.appendChild(tr);
  });
  $('results').classList.remove('hidden');
  updateCount();
}

const checkboxes = () => [...document.querySelectorAll('#cards input[type=checkbox]')];
const selectedCards = () => checkboxes().filter(cb => cb.checked).map(cb => cards[cb.dataset.index]);

function updateCount() {
  $('count').textContent = `${selectedCards().length} of ${cards.length} cards selected`;
}

$('toggle-all').onclick = () => {
  const allChecked = checkboxes().every(cb => cb.checked);
  checkboxes().forEach(cb => cb.checked = !allChecked);
  updateCount();
};

document.querySelectorAll('.export').forEach(btn => btn.onclick = async () => {
  try {
    const res = await post('/api/export', { cards: selectedCards(), title: video.title, format: btn.dataset.format });
    const name = (res.headers.get('Content-Disposition') || '').match(/filename\*?=(?:UTF-8'')?"?([^";]+)/)?.[1];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await res.blob());
    a.download = name ? decodeURIComponent(name) : `vocab.${btn.dataset.format}`;
    a.click();
  } catch (err) { setStatus(err.message, true); }
});
</script>
</body>
</html>
