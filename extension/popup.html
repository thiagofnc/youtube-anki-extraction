<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 520px; margin: .75rem; font-size: 13px; }
    #thumb { width: 100%; display: block; margin-bottom: .4rem; }
    button { padding: .3rem .6rem; margin: .2rem .2rem .2rem 0; }
    #cards-wrap { max-height: 360px; overflow-y: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    td { border-bottom: 1px solid #ddd; padding: .25rem .4rem; vertical-align: top; }
    td.word { font-size: 1.15rem; white-space: nowrap; }
    .error { color: #c00; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <p id="status">Loading…</p>

  <div id="preview" class="hidden">
    <img id="thumb" alt="">
    <strong id="title"></strong> <span id="author"></span>
    <p><button id="extract-btn">Extract vocabulary</button></p>
  </div>

  <div id="results" class="hidden">
    <span id="count"></span><br>
    <button id="toggle-all">Select / deselect all</button>
    <button data-format="apkg" class="export">Download .apkg</button>
    <button data-format="tsv" class="export">Download TSV</button>
    <div id="cards-wrap">
      <table><tbody id="cards"></tbody></table>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
